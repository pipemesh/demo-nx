# An Nx monorepo on Pipemesh: one dispatch pipeline fans each revision out
# to a pipeline per service, and a service's pipeline receives the revision
# only when a file Nx counts as one of its inputs changed.
#
# How: the graph job fingerprints every deployable project from Nx's own
# inputs (the nx/fingerprint component, `nx show target inputs`) and produces one
# entry per service. Each dispatch job consumes its service's entry and
# dispatches when it changed since that job last dispatched: a service that
# sat out ten commits still sees all ten when the next one changes it, and a
# README or a sibling's change reaches no one.
#
# Every job says what it is (job_type:) and what it reads (checkout:); the
# job type sets the defaults.

service: !include .pipemesh/service.yaml

dispatch:
  type: pipeline
  stages:
    - graph
    - dispatch
  jobs:
    # A build that checks out the whole tree: Nx reads nx.json, the
    # lockfile and every project's package.json and sources.
    graph:
      job_type: build
      stage: graph
      # Every fingerprint also covers the service pipeline's config and the
      # deploy scripts, which Nx's inputs cannot see.
      uses: nx/fingerprint@1
      with:
        image: ghcr.io/pipemesh/demo-nx-ci@sha256:36227715cf04b2a4b4278e134f8bce8ea50afe4fdf0bc7bb32d9e68ef572f03c
        install: npm ci --prefer-offline --no-audit --no-fund
        extra: .pipemesh/service.yaml deploy
      produces:
        orders: fingerprints/orders
        payments: fingerprints/payments
        inventory: fingerprints/inventory
        notifications: fingerprints/notifications
        catalog: fingerprints/catalog

    # One child pipeline per service. A job_type: pipeline job checks out
    # nothing, so the entry it consumes is its only input: it hands the
    # revision over only when that entry changed.
    orders:
      job_type: pipeline
      stage: dispatch
      consumes:
        - graph/orders
      body: !ref service
      variables:
        SERVICE: orders
    payments:
      job_type: pipeline
      stage: dispatch
      consumes:
        - graph/payments
      body: !ref service
      variables:
        SERVICE: payments
    inventory:
      job_type: pipeline
      stage: dispatch
      consumes:
        - graph/inventory
      body: !ref service
      variables:
        SERVICE: inventory
    notifications:
      job_type: pipeline
      stage: dispatch
      consumes:
        - graph/notifications
      body: !ref service
      variables:
        SERVICE: notifications
    catalog:
      job_type: pipeline
      stage: dispatch
      consumes:
        - graph/catalog
      body: !ref service
      variables:
        SERVICE: catalog

pipemesh:
  pipelines:
    pipeline: !ref dispatch
  workflows:
    checks:
      body: !include .pipemesh/checks.yaml
      on: pull_request
    ci_image:
      body: !include .pipemesh/ci-image.yaml
      on: push
