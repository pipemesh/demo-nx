# Pull request checks: test and build only the projects the change can
# affect, as Nx computes them against the merge base.
stages: [test]
jobs:
  affected:
    stage: test
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    cache: { key: "npm-${checksum:package-lock.json}", paths: [.npm], policy: pull }
    script: |
      apk add --no-cache -q git
      npm ci --cache .npm --prefer-offline --no-audit --no-fund
      base=$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)
      NX_DAEMON=false npx nx affected -t test build --base="$base" --head=HEAD
