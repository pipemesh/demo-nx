# Builds ghcr.io/pipemesh/demo-nx-ci when what it bakes in changes.
# The jobs pin it by digest: after a rebuild, update the digest in
# pipemesh.yaml and .pipemesh/*.yaml.
stages: [image]
jobs:
  # A build: it checks out what the image bakes in (the Dockerfile and
  # the workspace's package manifests), and a run whose checkout matches
  # a stored run reuses it.
  ci_image:
    kind: build
    stage: image
    checkout: [ci, .dockerignore, package.json, package-lock.json, apps/*/package.json, libs/*/package.json]
    secrets: [GHCR_TOKEN]
    script: |
      img=ghcr.io/pipemesh/demo-nx-ci
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
      DOCKER_BUILDKIT=1 docker build -f ci/Dockerfile -t "$img:$CI_COMMIT_SHA" .
      echo "$GHCR_TOKEN" | docker login ghcr.io -u pipemesh --password-stdin
      docker push "$img:$CI_COMMIT_SHA"
      echo "pin: $(docker inspect --format '{{index .RepoDigests 0}}' "$img:$CI_COMMIT_SHA")"
