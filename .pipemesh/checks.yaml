# Pull request checks: test and build every project, reading Nx Cloud's
# cache. A project the change leaves alone is a cache hit, so no merge
# base is needed and the checkout stays one commit deep.
type: workflow
stages:
  - test
jobs:
  # A build over the whole tree (the Nx project graph spans it): a
  # revision with the same tree as an earlier pass reuses it. Without a
  # token, Nx Cloud is read-only: proposed code reads the cache the
  # default branch's builds wrote, and never writes to it.
  affected:
    job_type: build
    stage: test
    checkout: true
    image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
    # npm's download cache, per lockfile: npm ci installs from it.
    cache:
      key: npm-${checksum:package-lock.json}
      restore_keys:
        - npm-
      paths:
        - .npm
    variables:
      npm_config_cache: .npm
      NX_DAEMON: "false"
      # In CI, Nx Cloud uploads each run's CPU and memory metrics to a "run
      # group" only its own CI integrations create; ours never exists, and
      # every job spent about a minute retrying the upload on a 404.
      NX_CLOUD_DISABLE_METRICS_COLLECTION: "true"
    script: |
      npm ci --prefer-offline --no-audit --no-fund
      npx nx run-many -t test build
